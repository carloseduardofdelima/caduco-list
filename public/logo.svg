<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hIconBg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <linearGradient id="hBorder" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="hPs2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38e1ff" />
      <stop offset="35%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#002277" />
    </linearGradient>

    <linearGradient id="hArchiveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (scaled inside 160x160 box at x=20, y=20) -->
  <g transform="translate(20, 20)">
    <rect width="160" height="160" rx="36" fill="url(#hIconBg)" />
    <rect width="160" height="160" rx="36" stroke="url(#hBorder)" stroke-width="3" />
    
    <!-- Mini PS2 in emblem -->
    <g transform="translate(18, 28) scale(0.35)">
      <!-- P -->
      <path d="M 50 40 H 120 C 150 40 170 60 170 90 C 170 120 150 140 120 140 H 90 V 220 H 50 V 40 Z M 90 75 V 105 H 118 C 130 105 138 100 138 90 C 138 80 130 75 118 75 H 90 Z" fill="url(#hPs2Grad)" />
      <!-- S -->
      <path d="M 230 60 C 220 48 204 40 184 40 C 154 40 136 56 136 82 C 136 124 220 108 220 150 C 220 166 206 176 184 176 C 160 176 144 164 132 148 L 104 174 C 122 198 150 210 184 210 C 228 210 256 186 256 148 C 256 102 172 120 172 80 C 172 70 180 64 192 64 C 206 64 218 70 226 80 L 230 60 Z" fill="url(#hPs2Grad)" />
      <!-- 2 -->
      <path d="M 264 70 C 264 52 280 40 304 40 C 328 40 344 54 344 76 C 344 102 316 126 288 152 H 346 V 192 H 262 V 156 L 304 112 C 314 102 318 92 318 82 C 318 74 312 68 304 68 C 294 68 286 74 284 82 L 264 70 Z" fill="url(#hPs2Grad)" />
    </g>

    <!-- 4 mini PS symbols -->
    <g transform="translate(80, 134) scale(0.65)">
      <!-- Triangle -->
      <polygon points="-45,-6 -36,9 -54,9" stroke="#00f5a0" stroke-width="2.5" fill="none" />
      <!-- Circle -->
      <circle cx="-15" cy="2" r="7.5" stroke="#ff4359" stroke-width="2.5" fill="none" />
      <!-- Cross -->
      <g transform="translate(15, 2)">
        <line x1="-5.5" y1="-5.5" x2="5.5" y2="5.5" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
        <line x1="5.5" y1="-5.5" x2="-5.5" y2="5.5" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
      </g>
      <!-- Square -->
      <rect x="38" y="-5.5" width="15" height="15" rx="1.5" stroke="#ff5ea5" stroke-width="2.5" fill="none" />
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(205, 50)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="144" height="24" rx="12" fill="#001838" stroke="#004fc4" stroke-width="1.5" />
    <circle cx="12" cy="12" r="3.5" fill="#00f0ff" />
    <text x="24" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#7dd3fc" letter-spacing="2">PLAYSTATION 2</text>

    <!-- Main Title -->
    <text x="0" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="2">
      <tspan fill="#ffffff">PS2</tspan><tspan fill="url(#hArchiveGrad)">.ARCHIVE</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
      CATÁLOGO &amp; REGISTRO DE JOGOS
    </text>
  </g>
</svg>
