<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#0055ff" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#002277" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.5" />
    </linearGradient>

    <!-- PS2 Iconic Gradient: Rich Electric Cyan to Deep PS2 Royal Blue -->
    <linearGradient id="ps2TextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38e1ff" />
      <stop offset="25%" stop-color="#00aaff" />
      <stop offset="65%" stop-color="#0051cc" />
      <stop offset="100%" stop-color="#002277" />
    </linearGradient>

    <!-- Chrome / Glass highlight -->
    <linearGradient id="shineGrad" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38e1ff" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Glass Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#centerGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Subtle PS2 Monolith grid / vertical lines in background -->
  <g opacity="0.08" stroke="#00f0ff" stroke-width="2">
    <line x1="120" y1="40" x2="120" y2="472" />
    <line x1="170" y1="40" x2="170" y2="472" />
    <line x1="220" y1="40" x2="220" y2="472" />
    <line x1="270" y1="40" x2="270" y2="472" />
    <line x1="320" y1="40" x2="320" y2="472" />
    <line x1="370" y1="40" x2="370" y2="472" />
    <line x1="420" y1="40" x2="420" y2="472" />
  </g>

  <!-- Top Badge: PlayStation 2 Pill -->
  <g transform="translate(256, 102)">
    <rect x="-86" y="-18" width="172" height="36" rx="18" fill="#001a44" stroke="#0055cc" stroke-width="2" />
    <circle cx="-62" cy="0" r="4" fill="#00f0ff" filter="url(#softGlow)" />
    <text x="-48" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#93c5fd" letter-spacing="3">PLAYSTATION 2</text>
  </g>

  <!-- Central "PS2" Geometric Monogram -->
  <!-- Outer Glow for PS2 -->
  <g filter="url(#glowFilter)" opacity="0.45">
    <!-- P -->
    <path d="M 96 160 H 176 C 212 160 234 182 234 216 C 234 250 212 272 176 272 H 146 V 344 H 96 V 160 Z M 146 202 V 230 H 174 C 188 230 196 224 196 216 C 196 208 188 202 174 202 H 146 Z" fill="#00f0ff" />
    <!-- S -->
    <path d="M 326 182 C 314 168 294 160 270 160 C 234 160 212 180 212 210 C 212 258 316 238 316 288 C 316 306 300 318 274 318 C 246 318 226 304 212 286 L 180 316 C 202 342 234 358 274 358 C 326 358 360 330 360 286 C 360 232 256 254 256 208 C 256 196 266 188 280 188 C 298 188 312 196 322 208 L 326 182 Z" fill="#00f0ff" />
    <!-- 2 -->
    <path d="M 362 196 C 362 174 380 160 408 160 C 438 160 456 178 456 204 C 456 236 422 264 388 296 H 458 V 344 H 360 V 302 L 410 248 C 420 236 426 224 426 212 C 426 202 418 196 408 196 C 396 196 388 204 386 214 L 362 196 Z" fill="#00f0ff" />
  </g>

  <!-- Sharp Main PS2 Letters -->
  <g>
    <!-- Letter P -->
    <path d="M 96 160 H 176 C 212 160 234 182 234 216 C 234 250 212 272 176 272 H 146 V 344 H 96 V 160 Z M 146 202 V 230 H 174 C 188 230 196 224 196 216 C 196 208 188 202 174 202 H 146 Z" fill="url(#ps2TextGrad)" />
    <!-- Top inner highlight line on P -->
    <path d="M 96 160 H 176 C 212 160 234 182 234 216" stroke="url(#shineGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Letter S -->
    <path d="M 326 182 C 314 168 294 160 270 160 C 234 160 212 180 212 210 C 212 258 316 238 316 288 C 316 306 300 318 274 318 C 246 318 226 304 212 286 L 180 316 C 202 342 234 358 274 358 C 326 358 360 330 360 286 C 360 232 256 254 256 208 C 256 196 266 188 280 188 C 298 188 312 196 322 208 L 326 182 Z" fill="url(#ps2TextGrad)" />
    <path d="M 270 160 C 234 160 212 180 212 210" stroke="url(#shineGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Number 2 -->
    <path d="M 362 196 C 362 174 380 160 408 160 C 438 160 456 178 456 204 C 456 236 422 264 388 296 H 458 V 344 H 360 V 302 L 410 248 C 420 236 426 224 426 212 C 426 202 418 196 408 196 C 396 196 388 204 386 214 L 362 196 Z" fill="url(#ps2TextGrad)" />
    <path d="M 408 160 C 438 160 456 178 456 204" stroke="url(#shineGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- Horizontal Divider with Cyan Neon Glow -->
  <line x1="84" y1="388" x2="428" y2="388" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.4" />
  <line x1="160" y1="388" x2="352" y2="388" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.9" filter="url(#softGlow)" />

  <!-- The 4 PlayStation Iconic Symbols at Bottom (Green Triangle, Red Circle, Cyan Cross, Pink Square) -->
  <g transform="translate(256, 428)">
    <!-- Triangle (Green #00f5a0) -->
    <g transform="translate(-90, 0)">
      <polygon points="0,-12 11,8 -11,8" stroke="#00f5a0" stroke-width="3.5" fill="none" stroke-linejoin="round" />
      <polygon points="0,-12 11,8 -11,8" stroke="#00f5a0" stroke-width="2" fill="none" stroke-linejoin="round" filter="url(#softGlow)" opacity="0.8" />
    </g>

    <!-- Circle (Red / Crimson #ff4359) -->
    <g transform="translate(-30, 0)">
      <circle cx="0" cy="0" r="10" stroke="#ff4359" stroke-width="3.5" fill="none" />
      <circle cx="0" cy="0" r="10" stroke="#ff4359" stroke-width="2" fill="none" filter="url(#softGlow)" opacity="0.8" />
    </g>

    <!-- Cross (Electric Cyan #00f0ff) -->
    <g transform="translate(30, 0)">
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
      <line x1="8" y1="-8" x2="-8" y2="8" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)" opacity="0.8" />
      <line x1="8" y1="-8" x2="-8" y2="8" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)" opacity="0.8" />
    </g>

    <!-- Square (Pink #ff5ea5) -->
    <g transform="translate(90, 0)">
      <rect x="-9" y="-9" width="18" height="18" rx="2" stroke="#ff5ea5" stroke-width="3.5" fill="none" stroke-linejoin="round" />
      <rect x="-9" y="-9" width="18" height="18" rx="2" stroke="#ff5ea5" stroke-width="2" fill="none" stroke-linejoin="round" filter="url(#softGlow)" opacity="0.8" />
    </g>
  </g>
</svg>
